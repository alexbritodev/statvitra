<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235137be'/%3E%3Cpath d='M8 17h4v8H8zm6-5h4v13h-4zm6-5h4v18h-4z' fill='white'/%3E%3C/svg%3E">
  <title>StatVitra · Card preview</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 16px/1.5 system-ui, sans-serif;
      background: light-dark(#eeeff9, #0c0e1a);
      color: light-dark(#141a32, #f4f4ff);
    }
    *, *::before, *::after { box-sizing: border-box }
    body { margin: 0 }
    main { max-width: 960px; padding: 52px 18px; margin: auto }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: end; flex-wrap: wrap; margin-bottom: 30px }
    h1 { font-size: clamp(2.5rem, 6vw, 4.125rem); margin: 0; letter-spacing: -.055em; line-height: 1 }
    p { margin: 10px 0 0; color: light-dark(#4c556f, #b9c2dd) }
    nav { display: flex; gap: 12px; flex-wrap: wrap; align-items: center }
    a { color: light-dark(#5137be, #c6b6ff); text-underline-offset: .22em }
    nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 9px }
    a[aria-current="true"], nav a:hover { background: light-dark(#e7e0ff, #29214b) }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start }
    img { display: block; width: 100%; height: auto }
    .report { margin-top: 20px }
    @media (max-width: 540px) {
      main { padding-top: 32px }
      header { gap: 12px; margin-bottom: 20px }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>StatVitra</h1>
        <p id="subtitle">GitHub profile cards · Sample data</p>
      </div>
      <nav aria-label="Preview language">
        <a href="?locale=en" lang="en" aria-current="true">English</a>
        <a href="?locale=pt-BR" lang="pt-BR">Português</a>
      </nav>
    </header>
    <div class="cards">
      <picture data-card="overview">
        <source media="(prefers-reduced-motion: no-preference) and (prefers-color-scheme: dark)" srcset="en/overview-dark-motion.svg">
        <source media="(prefers-reduced-motion: no-preference) and (prefers-color-scheme: light)" srcset="en/overview-light-motion.svg">
        <source media="(prefers-color-scheme: dark)" srcset="en/overview-dark.svg">
        <img src="en/overview-light.svg" alt="Profile overview" width="432" height="378">
      </picture>
      <picture data-card="languages">
        <source media="(prefers-reduced-motion: no-preference) and (prefers-color-scheme: dark)" srcset="en/languages-dark-motion.svg">
        <source media="(prefers-reduced-motion: no-preference) and (prefers-color-scheme: light)" srcset="en/languages-light-motion.svg">
        <source media="(prefers-color-scheme: dark)" srcset="en/languages-dark.svg">
        <img src="en/languages-light.svg" alt="Top languages" width="432" height="346">
      </picture>
      <picture data-card="projects">
        <source media="(prefers-reduced-motion: no-preference) and (prefers-color-scheme: dark)" srcset="en/projects-dark-motion.svg">
        <source media="(prefers-reduced-motion: no-preference) and (prefers-color-scheme: light)" srcset="en/projects-light-motion.svg">
        <source media="(prefers-color-scheme: dark)" srcset="en/projects-dark.svg">
        <img src="en/projects-light.svg" alt="Featured projects" width="432" height="354">
      </picture>
      <picture data-card="activity">
        <source media="(prefers-color-scheme: dark)" srcset="en/activity-dark.svg">
        <img src="en/activity-light.svg" alt="Public activity" width="432" height="270">
      </picture>
    </div>
    <p class="report"><a id="report" href="en/REPORT.md">Read the stats as text</a></p>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('locale') === 'pt-BR') {
      document.documentElement.lang = 'pt-BR'
      document.title = 'StatVitra · Prévia dos cards'
      document.querySelector('#subtitle').textContent = 'Cards para o perfil do GitHub · Dados de exemplo'
      const nav = document.querySelector('nav')
      nav.setAttribute('aria-label', 'Idioma da prévia')
      nav.querySelector('[lang="en"]').removeAttribute('aria-current')
      nav.querySelector('[lang="pt-BR"]').setAttribute('aria-current', 'true')
      const labels = { overview: 'Resumo do perfil', languages: 'Linguagens principais',
        projects: 'Projetos em destaque', activity: 'Atividade pública' }
      for (const picture of document.querySelectorAll('[data-card]')) {
        const card = picture.dataset.card
        for (const source of picture.querySelectorAll('source')) {
          source.srcset = source.getAttribute('srcset').replace('en/', 'pt-BR/')
        }
        const img = picture.querySelector('img')
        img.src = `pt-BR/${card}-light.svg`
        img.alt = labels[card]
      }
      const report = document.querySelector('#report')
      report.href = 'pt-BR/REPORT.md'
      report.textContent = 'Ler as estatísticas em texto'
    }
  </script>
</body>
</html>
