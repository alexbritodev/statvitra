name: Update StatVitra cards
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: write

concurrency:
  group: statvitra-profile-cards
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate cards
        uses: ./.github/statvitra
        with:
          token: ${{ github.token }}

      - name: Commit updated cards
        shell: bash
        run: |
          set -euo pipefail
          git add -- statvitra-cards
          if git ls-files --error-unmatch README.md >/dev/null 2>&1; then
            git add -u -- README.md
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update StatVitra cards'
          git push
